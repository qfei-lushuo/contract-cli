stages:
  - release

variables:
  GIT_DEPTH: "0"
  CONTRACT_CLI_BUILD_IMAGE: "docker.cnb.cool/znb/images/debian:latest"
  GITHUB_RELEASE_REPO: "yuwenGueen/contract-cli"
  GITHUB_SYNC_BRANCH: "main"
  GITHUB_FORCE_PUSH: "false"
  NPM_REGISTRY_URL: "https://registry.npmjs.org/"
  NPM_ACCESS: "public"
  # Optional. Set these in GitLab CI variables when you want branch-source checks.
  BETA_RELEASE_BRANCH: ""
  PRODUCTION_RELEASE_BRANCH: ""

release:
  stage: release
  image: "$CONTRACT_CLI_BUILD_IMAGE"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9]+)?$/'
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/'
    - when: never
  before_script:
    - |
      set -euo pipefail
      install_missing_tools() {
        missing=""
        for cmd in git go make node npm zip curl; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            missing="$missing $cmd"
          fi
        done
        if [ -z "$missing" ]; then
          return
        fi

        echo "missing tools before install:$missing"
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git golang-go make nodejs npm zip
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache ca-certificates curl git go make nodejs npm zip
        elif command -v yum >/dev/null 2>&1; then
          yum install -y ca-certificates curl git golang make nodejs npm zip
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y ca-certificates curl git golang make nodejs npm zip
        else
          echo "No supported package manager found. Please use a CI image with: git go make node npm zip curl" >&2
        fi
      }

      install_missing_tools
      for cmd in git go make node npm zip curl; do
        command -v "$cmd" >/dev/null 2>&1 || {
          echo "missing required command: $cmd" >&2
          exit 1
        }
      done
  script:
    - |
      set -euo pipefail

      require_env() {
        name="$1"
        if [ -z "${!name:-}" ]; then
          echo "$name is required" >&2
          exit 1
        fi
      }

      require_env GITHUB_TOKEN
      require_env NPM_TOKEN

      VERSION="${CI_COMMIT_TAG#v}"
      if [[ "$VERSION" != "$CI_COMMIT_TAG" ]]; then
        RELEASE_TAG="$CI_COMMIT_TAG"
      else
        RELEASE_TAG="v$VERSION"
      fi

      if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9]+)?$ ]]; then
        NPM_DIST_TAG="beta"
        GITHUB_RELEASE_FLAGS=(--prerelease)
        EXPECTED_BRANCH="${BETA_RELEASE_BRANCH:-}"
      elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        NPM_DIST_TAG="latest"
        GITHUB_RELEASE_FLAGS=(--latest)
        EXPECTED_BRANCH="${PRODUCTION_RELEASE_BRANCH:-}"
      else
        echo "unsupported release tag: $CI_COMMIT_TAG" >&2
        exit 1
      fi

      if [ -n "$EXPECTED_BRANCH" ]; then
        git fetch origin "$EXPECTED_BRANCH"
        if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$EXPECTED_BRANCH"; then
          echo "tag $CI_COMMIT_TAG is not reachable from origin/$EXPECTED_BRANCH" >&2
          exit 1
        fi
      fi

      go test ./...
      export VERSION GITHUB_RELEASE_REPO NPM_REGISTRY_URL NPM_ACCESS

      node <<'NODE'
      const fs = require("fs");
      const pkg = require("./package.json");

      pkg.version = process.env.VERSION;
      pkg.config = pkg.config || {};
      pkg.config.downloadBaseURLTemplate =
        `https://github.com/${process.env.GITHUB_RELEASE_REPO}/releases/download/v{version}`;

      if (process.env.NPM_PACKAGE_NAME) {
        pkg.name = process.env.NPM_PACKAGE_NAME;
      }
      pkg.publishConfig = pkg.publishConfig || {};
      pkg.publishConfig.registry = process.env.NPM_REGISTRY_URL || "https://registry.npmjs.org/";
      if (process.env.NPM_ACCESS) {
        pkg.publishConfig.access = process.env.NPM_ACCESS;
      }

      fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
      NODE

      PACKAGE_NAME="$(node -p "require('./package.json').name")"

      VERSION="$VERSION" make release-assets

      git remote remove github-release 2>/dev/null || true
      git remote add github-release "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_RELEASE_REPO}.git"
      if [ -n "${GITHUB_SYNC_BRANCH:-}" ]; then
        if [ "${GITHUB_FORCE_PUSH:-false}" = "true" ]; then
          git push --force-with-lease github-release "HEAD:refs/heads/${GITHUB_SYNC_BRANCH}"
        else
          git push github-release "HEAD:refs/heads/${GITHUB_SYNC_BRANCH}"
        fi
      fi
      if ! git ls-remote --exit-code --tags github-release "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
        git push github-release "HEAD:refs/tags/$RELEASE_TAG"
      fi

      export RELEASE_TAG NPM_DIST_TAG CI_PIPELINE_URL GITHUB_RELEASE_REPO GITHUB_TOKEN
      node <<'NODE'
      const fs = require("fs");
      const https = require("https");
      const path = require("path");
      const { URL } = require("url");

      const repo = process.env.GITHUB_RELEASE_REPO;
      const token = process.env.GITHUB_TOKEN;
      const tag = process.env.RELEASE_TAG;
      const isBeta = process.env.NPM_DIST_TAG === "beta";
      const assetDir = path.join(process.cwd(), "dist", "release-assets");

      function apiRequest(method, urlString, body, extraHeaders = {}) {
        return new Promise((resolve, reject) => {
          const url = new URL(urlString);
          let payload = body;
          const headers = {
            "User-Agent": "contract-cli-gitlab-cd",
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            ...extraHeaders,
          };
          if (payload && !Buffer.isBuffer(payload)) {
            payload = Buffer.from(JSON.stringify(payload));
            headers["Content-Type"] = "application/json";
          }
          if (payload) {
            headers["Content-Length"] = payload.length;
          }

          const req = https.request({
            method,
            hostname: url.hostname,
            path: `${url.pathname}${url.search}`,
            headers,
          }, (res) => {
            const chunks = [];
            res.on("data", (chunk) => chunks.push(chunk));
            res.on("end", () => {
              const text = Buffer.concat(chunks).toString("utf8");
              let data = text;
              try {
                data = text ? JSON.parse(text) : null;
              } catch (_) {}
              resolve({ statusCode: res.statusCode, data });
            });
          });
          req.on("error", reject);
          if (payload) {
            req.write(payload);
          }
          req.end();
        });
      }

      function expectOK(response, action) {
        if (response.statusCode < 200 || response.statusCode >= 300) {
          throw new Error(`${action} failed with status ${response.statusCode}: ${JSON.stringify(response.data)}`);
        }
        return response.data;
      }

      async function getOrCreateRelease() {
        const byTag = await apiRequest("GET", `https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(tag)}`);
        const releaseBody = {
          tag_name: tag,
          name: tag,
          body: `Release ${tag} from GitLab pipeline ${process.env.CI_PIPELINE_URL || ""}`.trim(),
          draft: false,
          prerelease: isBeta,
          make_latest: isBeta ? "false" : "true",
        };

        if (byTag.statusCode === 404) {
          return expectOK(
            await apiRequest("POST", `https://api.github.com/repos/${repo}/releases`, releaseBody),
            "create GitHub release"
          );
        }
        const release = expectOK(byTag, "get GitHub release");
        return expectOK(
          await apiRequest("PATCH", `https://api.github.com/repos/${repo}/releases/${release.id}`, releaseBody),
          "update GitHub release"
        );
      }

      async function uploadAssets(release) {
        const assets = expectOK(await apiRequest("GET", release.assets_url), "list GitHub release assets");
        for (const name of fs.readdirSync(assetDir)) {
          const file = path.join(assetDir, name);
          if (!fs.statSync(file).isFile()) {
            continue;
          }
          const existing = assets.find((asset) => asset.name === name);
          if (existing) {
            expectOK(await apiRequest("DELETE", existing.url), `delete existing asset ${name}`);
          }
          const uploadURL = `https://uploads.github.com/repos/${repo}/releases/${release.id}/assets?name=${encodeURIComponent(name)}`;
          expectOK(
            await apiRequest("POST", uploadURL, fs.readFileSync(file), { "Content-Type": "application/octet-stream" }),
            `upload asset ${name}`
          );
          console.log(`uploaded ${name}`);
        }
      }

      getOrCreateRelease().then(uploadAssets).catch((error) => {
        console.error(error.message);
        process.exit(1);
      });
      NODE

      printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > ~/.npmrc
      publish_args=(--registry "$NPM_REGISTRY_URL" --tag "$NPM_DIST_TAG")
      if [ -n "${NPM_ACCESS:-}" ]; then
        publish_args+=(--access "$NPM_ACCESS")
      fi
      npm publish "${publish_args[@]}"

      for attempt in 1 2 3 4 5 6; do
        published_version="$(npm view "$PACKAGE_NAME@$NPM_DIST_TAG" version --registry "$NPM_REGISTRY_URL" 2>/dev/null || true)"
        if [ "$published_version" = "$VERSION" ]; then
          break
        fi
        echo "npm dist-tag $NPM_DIST_TAG is not visible yet, retry $attempt/6"
        sleep 10
      done
      test "$(npm view "$PACKAGE_NAME@$NPM_DIST_TAG" version --registry "$NPM_REGISTRY_URL")" = "$VERSION"

      tmpdir="$(mktemp -d)"
      npm install -g "$PACKAGE_NAME@$VERSION" --registry "$NPM_REGISTRY_URL" --prefix "$tmpdir/prefix" --cache "$tmpdir/cache" --prefer-online
      "$tmpdir/prefix/bin/contract-cli" --version
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/release-assets/
