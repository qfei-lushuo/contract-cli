name: release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

env:
  NPM_REGISTRY_URL: https://registry.npmjs.org/
  NPM_ACCESS: public

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9]+)?$ ]]; then
            channel="beta"
            stable="false"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="latest"
            stable="true"
          else
            echo "Unsupported tag: $tag" >&2
            echo "Use v1.0.0-beta.1 or v1.0.0." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Test
        run: go test ./...

      - name: Prepare package
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${PACKAGE_NAME:-}" ]; then
            npm pkg set "name=$PACKAGE_NAME"
          fi

          npm pkg set "version=$VERSION"
          npm pkg set "publishConfig.registry=$NPM_REGISTRY_URL"
          npm pkg set "publishConfig.access=$NPM_ACCESS"
          npm pkg set "config.downloadBaseURLTemplate=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"

          node -p "'prepared ' + require('./package.json').name + '@' + require('./package.json').version"

      - name: Build release assets
        if: steps.release.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make release-assets

      - name: Publish GitHub Release
        if: steps.release.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/release-assets/* \
              --title "$RELEASE_TAG" \
              --notes "Release $RELEASE_TAG" \
              --latest
          fi

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required." >&2
            exit 1
          fi

          npm publish \
            --registry "$NPM_REGISTRY_URL" \
            --access "$NPM_ACCESS" \
            --tag "$CHANNEL"

      - name: Verify npm dist-tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"

          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "$package_name@$CHANNEL" version --registry "$NPM_REGISTRY_URL" 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ]; then
              exit 0
            fi
            echo "Waiting for npm dist-tag $CHANNEL ($attempt/6)"
            sleep 10
          done

          echo "npm dist-tag $CHANNEL did not resolve to $VERSION" >&2
          exit 1

      - name: Verify npm install
        if: steps.release.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          tmpdir="$(mktemp -d)"

          npm install -g "$package_name@$VERSION" \
            --registry "$NPM_REGISTRY_URL" \
            --prefix "$tmpdir/prefix" \
            --cache "$tmpdir/cache" \
            --prefer-online

          "$tmpdir/prefix/bin/contract-cli" --version

      - name: Upload release assets artifact
        if: always() && steps.release.outputs.stable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.release.outputs.version }}
          path: dist/release-assets/
          if-no-files-found: ignore
